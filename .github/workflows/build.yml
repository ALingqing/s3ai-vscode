name: Build & Package

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o s3ai-vscode.vsix

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: s3ai-vscode-vsix
          path: s3ai-vscode.vsix
          if-no-files-found: error

  release:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Read release version
        id: version
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          echo "version=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether release exists
        id: release_check
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "create=false" >> "$GITHUB_OUTPUT"
            echo "${{ steps.version.outputs.tag }} already exists; skipping release."
          else
            echo "create=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download packaged VSIX
        if: steps.release_check.outputs.create == 'true'
        uses: actions/download-artifact@v4
        with:
          name: s3ai-vscode-vsix
          path: release

      - name: Install publishing dependencies
        if: steps.release_check.outputs.create == 'true' && env.VSCE_PAT != ''
        run: npm ci

      - name: Publish to VS Code Marketplace
        if: steps.release_check.outputs.create == 'true' && env.VSCE_PAT != ''
        shell: bash
        run: npx @vscode/vsce publish --packagePath release/s3ai-vscode.vsix -p "$VSCE_PAT"

      - name: Create GitHub Release
        if: steps.release_check.outputs.create == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: S3AI v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release/s3ai-vscode.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
